<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Life V2 - Personal Life Coach</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>
    <h1>🌿 My Life V2</h1>
    <p>Your Personal Life Coach</p>
</header>


<nav>
    <button onclick="showPage('home')">🏠 Home</button>
    <button onclick="showPage('training')">💪 Training</button>
    <button onclick="showPage('nutrition')">🥗 Nutrition</button>
    <button onclick="showPage('health')">❤️ Health</button>
    <button onclick="showPage('coach')">🤖 Coach</button>
</nav>


<main>


<section id="home" class="page active">

<div class="card">

<h2>Welcome 👋</h2>

<input id="nameInput" placeholder="Your name">

<select id="gender">
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>


<input id="age" type="number" placeholder="Age">

<input id="weight" type="number" placeholder="Weight kg">

<input id="height" type="number" placeholder="Height cm">


<select id="goal">

<option>Fat Loss</option>
<option>Muscle Gain</option>
<option>Fitness</option>

</select>


<button onclick="saveProfile()">
Save Profile
</button>


</div>


<div class="card">

<h2>🌿 Life Score</h2>

<div id="lifeScore">
0%
</div>


</div>


<div class="card">

<h2>Today's Progress</h2>

<p id="dailySummary">
Complete your activities.
</p>


</div>


</section>





<section id="training" class="page">


<div class="card">

<h2>💪 Training</h2>


<select id="muscleSelect">

<option>Chest</option>
<option>Back</option>
<option>Legs</option>
<option>Shoulders</option>
<option>Biceps</option>
<option>Triceps</option>
<option>Abs</option>
<option>Full Body</option>

</select>


<button onclick="generateWorkout()">
Generate Workout
</button>


<div id="workoutResult"></div>


</div>


<div class="card">

<h2>🏃 Cardio Calculator</h2>


<select id="cardioType">

<option>Running</option>
<option>Cycling</option>
<option>Walking</option>

</select>


<input id="speed" placeholder="Speed km/h">

<input id="duration" placeholder="Minutes">


<button onclick="calculateCardio()">
Calculate Calories
</button>


<p id="cardioResult"></p>


</div>


</section>





<section id="nutrition" class="page">


<div class="card">


<h2>🥗 Nutrition Coach</h2>


<textarea id="foodInput"
placeholder="Example: 3 eggs chicken rice banana">
</textarea>


<button onclick="analyzeFood()">
Analyze Food
</button>


<div id="nutritionResult"></div>


</div>


</section>





<section id="health" class="page">


<div class="card">


<h2>❤️ Health Tracking</h2>


<input id="water"
placeholder="Water liters">


<input id="sleep"
placeholder="Sleep hours">


<input id="steps"
placeholder="Steps">


<input id="currentWeight"
placeholder="Current weight">


<button onclick="saveHealth()">
Save Health
</button>


<p id="healthResult"></p>


</div>


</section>





<section id="coach" class="page">


<div class="card">


<h2>🤖 Smart Coach</h2>


<div id="coachMessage">

Your coach is waiting for your data.

</div>


<button onclick="generateCoach()">
Get Advice
</button>


</div>


</section>


</main>


<script src="script.js"></script>

</body>
</html>
